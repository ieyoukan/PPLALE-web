apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pplale-room-server.fullname" . }}
  labels:
    {{- include "pplale-room-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # ルームは Redis にあり、Pod は接続しか持たない。新しい Pod が受けられるようになってから古い Pod を止める。
  # 止まる Pod につながっていたブラウザは、すぐ別の Pod につなぎ直して続きから遊べる。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "pplale-room-server.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "pplale-room-server.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_URL
              value: {{ include "pplale-room-server.redisUrl" . | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ join "," .Values.allowedOrigins | quote }}
            - name: TRUST_PROXY
              value: {{ .Values.trustProxy | quote }}
            - name: REQUESTS_PER_HOUR
              value: {{ .Values.requestsPerHour | quote }}
            - name: MAX_ROOMS
              value: {{ .Values.maxRooms | quote }}
            - name: ROOM_IDLE_HOURS
              value: {{ .Values.roomIdleHours | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # Redis に届かない Pod には新しい接続を回さない。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # Pod をなるべく別のノードに置く (1台しかなければ同じノードでよい)。
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pplale-room-server.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
      volumes:
        # ルート FS は読み取り専用にしている。
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
