# ルームは Redis に置き、ルームサーバーの Pod は接続しか持たない。Pod は何台でもよく、
# 入れ替えても進行中の対戦は続く (つながっていたブラウザが別の Pod につなぎ直す)。
replicaCount: 2

image:
  repository: ghcr.io/ieyoukan/pplale-room-server
  # 実際にどのタグをデプロイするかは Argo CD Image Updater が決める
  # (update-strategy: semver, allow-tags: ^[0-9]+\.[0-9]+\.[0-9]+$)。
  # room-server-image.yml が main への push のたびに <major>.<minor>.<patch> 形式のタグを push する。
  # ここは Argo CD 管理下にない手動 helm install 時のフォールバック。
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

# ゲーム (ブラウザ) から直接つながるので、外から届く URL が必要 (HTTP と WebSocket の両方)。
# その URL を Web アプリの NEXT_PUBLIC_ROOM_SERVER_URL に設定する。
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pplale-room.youkan.uk
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ブラウザからの呼び出しと WebSocket 接続を許す Web アプリのオリジン。"*" を入れるとどこからでも許す。
allowedOrigins:
  - https://pplale.vercel.app

# 1つの送信元から1時間に受け付ける「ルームを作る・入る・調べる」の回数
# (ルームIDの総当たりを抑える)。対戦中の操作は数えない。送信元のアドレスは保存しない。
requestsPerHour: 120
# Ingress / Tunnel の後ろで X-Forwarded-For から送信元を読む。
trustProxy: true
# そのうち「ルームを作る」の回数 (Pod ごとに数える)。
roomsPerHour: 10
# 対戦が始まる前に、ホストがこれだけの時間つながっていなければルームを解散する
# (ゲストなら席を空ける)。X や Discord に募集を貼りに行く間に切れても戻れるよう長めにする。
lobbyGraceMinutes: 10
# 対戦中・対戦後に、2人ともこれだけの時間つながっていなければルームを解散する。
abandonMinutes: 30
# 同時に持つルームの上限。超えると新しいルームを作れない。
maxRooms: 500
# だれも操作しなくなってからこの時間が過ぎたルームを消す。
roomIdleHours: 12

# 対戦の処理は1手あたり数ミリ秒。
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: "1"
    memory: 384Mi

redis:
  # このチャートで Redis を1つ立てる。
  enabled: true
  # ほかの Redis を使うときはその URL (redis://[:password@]host:port)。入れるとこのチャートの Redis は作らない。
  url: ""
  image:
    repository: redis
    tag: 7.4-alpine
    pullPolicy: IfNotPresent
  # 1ルームは数十KB。上限を超えると新しいルームを作れなくなる (古いルームは時間で消える)。
  maxMemory: 256mb
  # ルームサーバーの Pod 以外から Redis につながせない (CNI が NetworkPolicy に対応している場合に効く)。
  networkPolicy: true
  persistence:
    # 切ると、Redis が入れ替わったときに進行中のルームと対戦が消える。
    enabled: true
    # 空ならクラスタのデフォルト。自宅クラスタでは proxmox-data。
    storageClass: ""
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 384Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
