{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pplale-cpu-server.fullname" . }}-server
spec:
  podSelector:
    matchLabels:
      {{- include "pplale-cpu-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
    {{- if and .Values.ingress.enabled (eq .Values.ingress.className "cloudflare") }}
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.tunnelNamespace | quote }}
          podSelector:
            matchLabels:
              app: controlled-cloudflared-connector
      ports:
        - { port: 8080, protocol: TCP }
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  # Learning and report verification use local files only. Replies to inbound requests still work.
  {{- if .Values.networkPolicy.extraEgress }}
  egress:
    {{- toYaml .Values.networkPolicy.extraEgress | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
