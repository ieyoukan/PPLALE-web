apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pplale-cpu-server.fullname" . }}
  labels:
    {{- include "pplale-cpu-server.labels" . | nindent 4 }}
spec:
  replicas: 1
  # ボリュームは1つの Pod からしか書けないので、入れ替えるときは先に止める。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pplale-cpu-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pplale-cpu-server.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
            - name: ALLOWED_ORIGINS
              value: {{ join "," .Values.allowedOrigins | quote }}
            - name: TRUST_PROXY
              value: {{ .Values.trustProxy | quote }}
            - name: REPORTS_PER_HOUR
              value: {{ .Values.reportsPerHour | quote }}
            - name: TRAINING
              value: {{ ternary "on" "off" .Values.training.enabled | quote }}
            - name: TRAIN_MIN_NEW_REPORTS
              value: {{ .Values.training.minNewReports | quote }}
            - name: TRAIN_INTERVAL_MINUTES
              value: {{ .Values.training.intervalMinutes | quote }}
            - name: TRAIN_THREADS
              value: {{ .Values.training.threads | quote }}
            - name: SELFPLAY_GAMES
              value: {{ .Values.training.selfPlayGames | quote }}
            - name: HUMAN_WEIGHT
              value: {{ .Values.training.humanWeight | quote }}
            - name: GATE_PAIRS
              value: {{ .Values.training.gatePairs | quote }}
            - name: GATE_MIN_RATE
              value: {{ .Values.training.gateMinRate | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pplale-cpu-server.claimName" . }}
          {{- else }}
          # 検証用: Pod が入れ替わると対戦記録も学習したモデルも消える。
          emptyDir: {}
          {{- end }}
        # ルート FS は読み取り専用にしている。
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
