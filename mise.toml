[tools]
node = "22.23.2"

[env]
_.path = ["./node_modules/.bin"]

[tasks.install]
description = "Install dependencies from package-lock.json"
run = "npm ci"

[tasks.dev]
description = "Start the Next.js development server"
run = "npm run dev"

[tasks.check]
description = "Run type checking, linting, and card data checks"
depends = ["typecheck", "lint", "cards-check"]

[tasks.typecheck]
run = "npm run typecheck"

[tasks.lint]
run = "npm run lint"

[tasks.cards-check]
run = "npm run cards:check"

[tasks.build]
description = "Create a production build"
run = "npm run build"
