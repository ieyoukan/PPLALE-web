[tools]
node = "26.12.1"
pnpm = "10.33.2"

[env]
_.path = ["./node_modules/.bin"]

[tasks.install]
description = "Install dependencies from pnpm-lock.yaml"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start the Next.js development server"
run = "pnpm run dev"

[tasks.check]
description = "Run type checking, linting, and card data checks"
depends = ["typecheck", "lint", "cards-check", "ui-structure"]

[tasks.typecheck]
run = "pnpm run typecheck"

[tasks.lint]
run = "pnpm run lint"

[tasks.cards-check]
run = "pnpm run cards:check"

[tasks.build]
description = "Create a production build"
run = "pnpm run build"

[tasks.ui-structure]
run = "pnpm run check:ui"
