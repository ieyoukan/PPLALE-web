name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - name: Install tools from mise.toml
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and verify site fonts
        run: pnpm run test:fonts

      - name: Generate and verify game assets
        run: pnpm run test:game-assets

      - name: Check game opening and draw flow
        run: pnpm run test:game

      - name: Set up research Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/cpu/requirements.lock.txt

      - name: Test research data, training and evaluation
        run: |
          python3 -m pip install -r research/cpu/requirements.lock.txt
          python3 -m unittest discover -s research/cpu -p 'test_*.py'

      - name: Test the CPU server
        run: pnpm run test:cpu-server

      - name: Test browser play timing and private journal
        run: pnpm run test:play-performance

      - name: Test the room server
        run: pnpm run test:room-server

      - name: Test the room server on Redis
        run: pnpm run test:room-server
        env:
          REDIS_URL: redis://localhost:6379

      - name: Run project checks
        run: mise run check

      - name: Generate and verify deck images
        run: pnpm run test:deck-images

      - name: Check for vulnerabilities
        run: pnpm audit --audit-level=moderate || true
