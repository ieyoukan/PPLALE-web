name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - name: Install tools from mise.toml
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Check game opening and draw flow
        run: npm run test:game

      - name: Test the CPU server
        run: npm run test:cpu-server

      - name: Test the room server
        run: npm run test:room-server

      - name: Test the room server on Redis
        run: npm run test:room-server
        env:
          REDIS_URL: redis://localhost:6379

      - name: Run project checks
        run: mise run check

      - name: Check for vulnerabilities
        run: npm audit --audit-level=moderate || true
